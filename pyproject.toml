[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gostringungarbler"
version = "1.1.0"
description = "Resolve strings in Go binaries obfuscated by garble"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Mandiant" },
]
dependencies = [
    "capstone",
    "lief",
    "unicorn",
]

[project.scripts]
gostringungarbler = "GoStringUngarbler.__main__:main"

[tool.setuptools.packages.find]
include = ["GoStringUngarbler*"]
